[package]
name = "setboy"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tokio = { version = "1.52.3", features = ["full"] }
dotenvy = "0.15.7"
genai = "0.6.5"
tui-textarea-2 = "0.12.0"
futures = "0.3.32"
color-eyre = "0.6.5"
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
tokio-stream = "0.1.18"
toml = { version = "1.1.2+spec-1.1.0", features = ["serde"] }
directories = { version = "6.0.0"}
redb = { version = "4.1.0" }
serde_with = "3.21.0"
smart-default = "0.7.1"
textwrap = { version = "0.16.2" }
unicode-width = "0.2.2"
uuid = { version = "1.23.4", features = ["v7", "serde"] }
